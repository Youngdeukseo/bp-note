name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apk/**"
      - ".github/workflows/apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install and sync
        working-directory: apk
        run: |
          npm install --no-audit --no-fund
          npx cap sync android
      - name: Build APK
        working-directory: apk/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: cp apk/android/app/build/outputs/apk/debug/app-debug.apk bp-note.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest bp-note.apk --title "혈압 노트 APK" --notes "휴대폰에서 bp-note.apk 를 내려받아 설치하세요." --latest=false
